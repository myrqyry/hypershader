<!doctype html><html><head><meta charset="utf-8"><title>hypershader preview smoke</title></head>
<body><output id="result">PENDING</output><canvas id="target" width="64" height="64" style="width:64px;height:64px"></canvas>
<script src="../engine/graph.js"></script>
<script src="../nodes/catalog.js"></script>
<script src="../nodes/colormap-kernels.js"></script>
    <script src="../engine/codegen.js"></script>
<script src="../preview.js"></script>
<script>
try {
    const catalog = new NodeCatalog(NODE_CATALOG);
    const graph = new ShaderGraph();
    const color = graph.addNode('input_color', {x:0,y:0}, catalog);
    const output = graph.addNode('output_color', {x:100,y:0}, catalog);
    if (!graph.connect(color.id, 'output', output.id, 'color')) throw new Error('Graph did not connect');
    graph.setNodeValue(color.id, 'r', 0.8);
    graph.setNodeValue(color.id, 'g', 0.2);
    graph.setNodeValue(color.id, 'b', 0.1);
    const renderer = new ShaderPreviewRenderer(document.getElementById('target'));
    const compiler = new ShaderCodeGenerator();
    const shader = compiler.buildPreviewShader(graph);
    renderer.setShader(shader);
    renderer.renderFrame(0);
    const sample = () => {
        const rgba = new Uint8Array(4);
        renderer.gl.readPixels(32, 32, 1, 1, renderer.gl.RGBA, renderer.gl.UNSIGNED_BYTE, rgba);
        return rgba;
    };
    const first = sample();
    if (Math.abs(first[0] - 204) > 2 || Math.abs(first[1] - 51) > 2 || Math.abs(first[2] - 26) > 2) {
        throw new Error('First render pixel wrong: ' + Array.from(first));
    }
    graph.setNodeValue(color.id, 'r', 0.25);
    renderer.setShader(compiler.buildPreviewShader(graph));
    renderer.renderFrame(100);
    const second = sample();
    if (Math.abs(second[0] - 64) > 2) throw new Error('Live update pixel wrong: ' + Array.from(second));
    let rejected = false;
    try { renderer.setShader('not valid glsl'); } catch (err) { rejected = /compile|shader/i.test(String(err)); }
    if (!rejected) throw new Error('Invalid GLSL was accepted');
    const brokenNodeSource = compiler.buildPreviewShader(graph)
        .replace('vec4 v0 = vec4(', 'vec4 v0 = noSuchConstructor(');
    if (brokenNodeSource === compiler.buildPreviewShader(graph)) throw new Error('Failed to corrupt node shader fixture');
    let attributed = false;
    try { renderer.setShader(brokenNodeSource); }
    catch (err) { attributed = /Generated by node node_1 \(input_color\)/.test(String(err)); }
    if (!attributed) throw new Error('WebGL compile error did not identify the originating node');
    // Verify named colormap nodes actually color pixels, not just emit valid GLSL.
    const colormapSamples = [];
    for (const name of ['colormap_jet', 'colormap_spectral', 'colormap_lava_waves', 'colormap_space']) {
        const g = new ShaderGraph();
        const scalar = g.addNode('input_float', {x:0,y:0}, catalog);
        const map = g.addNode(name, {x:80,y:0}, catalog);
        const out = g.addNode('output_color', {x:160,y:0}, catalog);
        if (!g.connect(scalar.id,'output',map.id,'t') ||
            !g.connect(map.id,'result',out.id,'color')) throw new Error(name + ' graph connection failed');
        const colors = [];
        for (const value of [0.2, 0.8]) {
            g.setNodeValue(scalar.id, 'value', value);
            renderer.setShader(compiler.buildPreviewShader(g));
            renderer.renderFrame(200);
            colors.push(Array.from(sample()).slice(0,3));
        }
        const delta = colors[0].reduce((sum, channel, i) => sum + Math.abs(channel - colors[1][i]),0);
        if (delta < 20) throw new Error(name + ' has no meaningful pixel response: '+JSON.stringify(colors));
        colormapSamples.push(colors[0].join(','));
    }
    if (new Set(colormapSamples).size !== 4) throw new Error('Four colormaps should have distinct output');
    renderer.dispose();
    document.getElementById('result').textContent = 'PASS: real WebGL2 pixels, 4 responsive colormaps, live update, compile rejection';
} catch (err) {
    document.getElementById('result').textContent = 'FAIL: ' + (err?.stack || String(err));
}
</script>
</body></html>
