<!doctype html><html><body><output id="result">PENDING</output>
<iframe src="../index.html" width="1100" height="750"></iframe>
<script>
const frame=document.querySelector('iframe');
frame.onload=()=>setTimeout(()=>{
  const output=document.getElementById('result');
  try {
    const view=frame.contentWindow;
    const app=view.app;
    if(!app || !app.graph.getOutputNode()) throw Error('Demo not initialized');
    const button=view.document.getElementById('btnCurate');
    if(!button) throw Error('Curate button missing from real UI');
    view.confirm=()=>true;
    const originalRandom=view.Math.random;
    let count=0;
    for(const seed of [0.0,0.42,0.68,0.95]) {
      view.Math.random=()=>seed;
      button.click();
      if(!app.elements.shaderName.value.startsWith('Curated - '))throw Error('Curate not wired');
      if(!app.previewRenderer?.program)throw Error('Curated preview did not compile: '+app.elements.previewOverlay.textContent);
      if(!app.elements.previewOverlay.classList.contains('hidden'))throw Error('Curated overlay shows error');
      app.previewRenderer.renderFrame(1234);
      const gl=app.previewRenderer.gl;
      const pixel=new Uint8Array(4);
      gl.readPixels(65,65,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);
      if(pixel[3]!==255 || pixel.slice(0,3).every(x=>x===0)) throw Error('Curated GPU black/transparent: '+pixel);
      if(!app.codegen.generate(app.graph).includes('technique Draw'))throw Error('Native code not generated');
      count++;
    }
    view.Math.random=originalRandom;
    output.textContent='PASS: '+count+' Curate UI click-to-real-WebGL2-render variants';
  }catch(error){output.textContent='FAIL: '+(error.stack||error);}
},1200);
</script></body></html>
