
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux OBS31 build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify canonical project identity
        run: python3 scripts/test-project-name.py
      - name: Check README links
        run: |
          python3 .github/scripts/test-readme-links.py
          python3 .github/scripts/check_readme_links.py README.md
      - name: Verify deterministic OBS SDK contract
        run: python3 .github/scripts/test-ci-sdk-contract.py
      - name: Verify shared package adapter
        run: python3 -B scripts/test-shared-ci.py
      - name: Verify candidate source export boundary
        run: python3 scripts/test-stage-release-source.py
      - name: Verify graph allocation budget
        run: |
          cc -std=c17 -Wall -Wextra -Werror -Isrc scripts/test-graph-budget.c -o "$RUNNER_TEMP/hs-graph-budget-test"
          "$RUNNER_TEMP/hs-graph-budget-test"
      - name: Verify native shader vocabulary and migration
        run: |
          python3 -B scripts/test-native-shader-vocabulary.py
          python3 -B scripts/test-migrate-shader-vocabulary.py
          python3 -B scripts/verify-native-boundary.py
      - name: Verify shader settings contracts
        run: node --test scripts/test-verify-settings.js && node scripts/verify-settings.js
      - name: Verify Linux installer layouts
        run: python3 scripts/test-linux-installer.py && python3 scripts/test-obs33-install-layout.py
      - name: Verify OBS 32/33 image ABI bridge
        run: python3 scripts/test-obs33-image-abi.py
      - name: Build plugin
        uses: ./.github/actions/build-plugin
        with:
          target: x86_64
      - name: Verify Linux payload
        shell: bash
        run: |
          module="$(find release -type f -name 'hypershader.so' -print -quit)"
          test -n "$module" && test -s "$module"
          test -d release/RelWithDebInfo/data

  windows:
    name: Windows x64 build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build plugin
        uses: ./.github/actions/build-plugin
        with:
          target: x64
      - name: Verify Windows payload
        shell: pwsh
        run: |
          $modern = 'release/RelWithDebInfo/hypershader/hypershader.dll'
          $legacy = 'release/RelWithDebInfo/hypershader/bin/64bit/hypershader.dll'
          if (-not (Test-Path $modern)) { throw 'Missing OBS 33 modern-layout hypershader.dll' }
          if (-not (Test-Path $legacy)) { throw 'Missing legacy-layout hypershader.dll' }

  macos:
    name: macOS universal build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build plugin
        uses: ./.github/actions/build-plugin
        with:
          target: universal
      - name: Verify macOS payload
        shell: bash
        run: |
          bundle="$(find release -type d -name 'hypershader.plugin' -print -quit)"
          test -n "$bundle"
          test -s "$bundle/Contents/MacOS/hypershader"
